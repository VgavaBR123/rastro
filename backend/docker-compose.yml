# Sobe o PostGIS com o esquema inicial. Para o MVP rodamos a API no host
# (dart run bin/server.dart) apontando para este banco.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atividades
    ports:
      # 5433 no host: a 5432 costuma estar ocupada por outro projeto local.
      # A API no host conecta com DB_PORT=5433.
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atividades"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
